name: Nightly backup

# Supabase's daily backups live with the database, so a problem at the
# provider could take both. This copy is kept somewhere else: a pg_dump of
# production, encrypted here with a public key, so the bucket only ever
# holds ciphertext and the key that opens it is kept by a person, not by CI.
# How long dumps are kept is the bucket's lifecycle rule, not this job's.
# README's "Backups" section has the restore.
on:
  schedule:
    # 02:30 UTC, the quietest hour for a UK user base.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For its MIGRATION_DATABASE_URL: the migrating role owns the tables, so
    # row level security does not hide any row from the dump.
    environment: production
    env:
      DUMP: temply-${{ github.run_id }}.dump.age
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      # pg_dump refuses a server newer than itself and the runner's client
      # trails Supabase, so it runs from the image of the major version
      # compose.yaml uses. Only our schemas: public, and drizzle for the
      # record of which migrations have run. Supabase's own schemas come
      # with any new project, and restoring them over one would fail.
      # `shell: bash` runs with pipefail, which the default shell does not:
      # without it a failed dump would still upload whatever age encrypted.
      - name: Dump and encrypt
        shell: bash
        run: |
          docker run --rm -e PGCONNECT_TIMEOUT=10 -e DUMP_URL postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --schema=public --schema=drizzle "$DUMP_URL"' \
            | age --recipient "$BACKUP_AGE_RECIPIENT" --output "$DUMP"
          ls -l "$DUMP"
        env:
          DUMP_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}

      # Any S3-compatible store: for R2, BACKUP_S3_ENDPOINT is the account's
      # endpoint and the region is `auto`; for S3 itself, leave the endpoint
      # unset. Dated keys, so the lifecycle rule can expire by age.
      - name: Upload
        run: |
          aws s3 cp "$DUMP" "s3://$BACKUP_BUCKET/$(date -u +%Y/%m/%d)/$DUMP" \
            ${BACKUP_S3_ENDPOINT:+--endpoint-url "$BACKUP_S3_ENDPOINT"} \
            --cli-connect-timeout 10 --only-show-errors
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
