name: CI / CD

on:
  push:
    branches: [main, staging, feature/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Once a release starts, let it finish before the next run: cancelling
  # between the migration and the deploy would leave the new schema under
  # the old release for longer than it has to be.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  check:
    name: Typecheck, test, design gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history: the sitemap dates each page by the last commit
      # that touched it, and a depth-1 clone would date them all today.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to the version everyone runs locally. On `latest` a Bun release
      # can turn the suite red with no commit behind it — 1.4.2 did, by
      # reordering the test files enough to expose global leakage between them.
      # Upgrading is a commit that runs the gates, not something CI decides.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # A critical advisory in Next sat unnoticed for a release because nobody
      # runs `bun audit` by hand. High and above fails the build; moderate
      # advisories are read, not gated on — the one open today is fixed
      # only across a major of the editor's framework.
      - name: Audit
        run: bun audit --audit-level=high

      - name: Typecheck
        run: bun run typecheck

      # A schema change without its migration would deploy code the database
      # does not match. Generating needs no database: it compares the schema
      # with the last snapshot in server/drizzle.
      - name: Migrations match the schema
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain server/drizzle)" ]; then
            echo "shared/schema.ts changed without a migration. Run bun run db:generate and commit server/drizzle." >&2
            git status --porcelain server/drizzle >&2
            exit 1
          fi

      # Biome, on a curated set: the rules that find a bug or an accessibility
      # gap, not the ones that argue about style. A warning fails the build
      # the same way an error does, so none can pile up.
      - name: Lint
        run: bun run lint

      - name: Deployment script syntax
        run: bash -n deploy/railway/start.sh deploy/railway/deploy.sh deploy/railway/smoke.sh

      - name: Test
        run: bun test

      # The design gates: colours stay in the token layer and every motion
      # sits on a duration token. They fail the build the same way a type
      # error does.
      - name: Contrast
        run: bun run check:contrast
        working-directory: client
      - name: Editor contrast
        run: bun run check:editor-contrast
        working-directory: client
      - name: Email dark mode
        run: bun run check:email-dark
        working-directory: client
      - name: Motion tokens
        run: bun run check:motion
        working-directory: client

  # Independent of `check`: a type error and a broken sign-in should each
  # show up as its own red mark, and the browser run's twenty-odd minutes
  # should not wait on the build job. The stack it drives (fakes, and the
  # built client with the API inside it) is started by Playwright's
  # webServer, so nothing is started here by hand.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    # Headroom over the suite's own budget rather than a target: the sign-in
    # gets two capped attempts before it gives up, and a cold `next build` on
    # a shared runner can take most of five minutes on its own.
    timeout-minutes: 35
    # The run makes its own database here (e2e/database.ts). The URL e2e/env.ts
    # defaults to is this service's, as it is compose.yaml's locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    steps:
      # The whole history: the sitemap dates each page by the last commit
      # that touched it, and a depth-1 clone would date them all today.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # --with-deps also installs Chromium's system libraries, which the
      # runner image does not carry.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # The Clerk keys are the dev instance's; the two users exist there
      # with password sign-in. INTERNAL_API_SECRET only has to agree between
      # the proxy and the API inside this run's client, so a fixed value is
      # enough.
      # Run from the package, not through `bun run --filter`: Bun prefixes
      # every line of a filtered script with the package name, and GitHub
      # reads the `github` reporter's annotations only at column 0.
      - name: Run
        run: bunx playwright test
        working-directory: e2e
        env:
          CI: "1"
          E2E_RUN_ID: ${{ github.run_id }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_2_EMAIL: ${{ secrets.E2E_USER_2_EMAIL }}
          E2E_USER_2_PASSWORD: ${{ secrets.E2E_USER_2_PASSWORD }}
          INTERNAL_API_SECRET: e2e-internal-secret
      # Screenshots and the report only. A trace or video records the test
      # user's session cookies and Clerk's testing token, and this
      # repository's artifacts are public; reproduce locally for a trace.
      - name: Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            e2e/test-results/**/*.png
            e2e/playwright-report
          retention-days: 3

  # Build, migrate, release, in that order: the database is touched only
  # once the build has succeeded, and the release goes out only once the
  # migration has. The release still serving while it runs keeps working,
  # because a migration only ever adds (expand, then contract: CLAUDE.md).
  # Git deploys of these two branches are off in client/vercel.json, so
  # this is the only way either is released.
  deploy:
    name: Deploy to Vercel
    needs: [check, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ vars.APP_URL }}
    # Staging is a preview deployment of the staging branch, aliased to its
    # own domain, so it builds with the Preview variables.
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Vercel CLI
        run: bun add --global vercel@60.1.3
      # Run from the repository root: the project's Root Directory is
      # client/, and the build imports server/ and shared/ from beside it.
      - name: Build
        run: |
          vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
          vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
      # The session pooler's URL; server/scripts/migrate.ts says why not the
      # direct connection.
      - name: Migrate
        run: bun run db:migrate
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      # `deploy --prod` moves the production domain itself; a preview gets
      # the staging domain only when it is aliased there.
      - name: Release
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "Deployed $url"
          if [ -z "$PROD_FLAG" ]; then
            vercel alias set "$url" "${APP_URL#https://}" --token="$VERCEL_TOKEN"
          fi
      # Through the public domain, so it proves what customers reach: the
      # domain, the function and the database behind it.
      - name: Health
        run: curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 30 "${APP_URL%/}/api/health"
