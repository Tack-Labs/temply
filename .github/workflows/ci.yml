name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, design gates, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version everyone runs locally. On `latest` a Bun release
      # can turn the suite red with no commit behind it — 1.4.2 did, by
      # reordering the test files enough to expose global leakage between them.
      # Upgrading is a commit that runs the gates, not something CI decides.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # The design gates: colours stay in the token layer and every motion
      # sits on a duration token. They fail the build the same way a type
      # error does.
      - name: Contrast
        run: bun run check:contrast
        working-directory: client
      - name: Editor contrast
        run: bun run check:editor-contrast
        working-directory: client
      - name: Email dark mode
        run: bun run check:email-dark
        working-directory: client
      - name: Motion tokens
        run: bun run check:motion
        working-directory: client

      # A production build with placeholder keys: Clerk validates the shape
      # of its publishable key at build time but does not call home, and no
      # other secret is read until a request arrives.
      - name: Build client
        run: bun run build
        working-directory: client
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_placeholder
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build server
        run: bun run build
        working-directory: server

  # Independent of `check`: a type error and a broken sign-in should each
  # show up as its own red mark, and the browser run's twenty-odd minutes
  # should not wait on the build job. The stack it drives (fakes, the API on
  # a fresh SQLite, the built client) is started by Playwright's webServer,
  # so nothing is started here by hand.
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # --with-deps also installs Chromium's system libraries, which the
      # runner image does not carry.
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: e2e
      # The Clerk keys are the dev instance's; the two users exist there
      # with password sign-in. INTERNAL_API_SECRET only has to agree between
      # the API and the client of this run's fresh stack, so a fixed value
      # is enough.
      # Run from the package, not through `bun run --filter`: Bun prefixes
      # every line of a filtered script with the package name, and GitHub
      # reads the `github` reporter's annotations only at column 0.
      - name: Run
        run: bunx playwright test
        working-directory: e2e
        env:
          CI: "1"
          E2E_RUN_ID: ${{ github.run_id }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_USER_2_EMAIL: ${{ secrets.E2E_USER_2_EMAIL }}
          E2E_USER_2_PASSWORD: ${{ secrets.E2E_USER_2_PASSWORD }}
          INTERNAL_API_SECRET: e2e-internal-secret
      # Screenshots and the report only. A trace or video records the test
      # user's session cookies and Clerk's testing token, and this
      # repository's artifacts are public; reproduce locally for a trace.
      - name: Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            e2e/test-results/**/*.png
            e2e/playwright-report
          retention-days: 3
